name = "gymfolio-api-dev"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Local / default wrangler target = *dev*.
# Staging = `wrangler deploy --env staging` (see docs/STAGING.md).
# Placeholder IDs are fine for `wrangler dev` (Miniflare). Replace before --remote / deploy.
#
# Secrets (MASTER_KEY, YOUTUBE_API_KEY) must NEVER appear in this file.
# Local: apps/api/.dev.vars (gitignored). Remote: `wrangler secret put … --env <env>`.

[[d1_databases]]
binding = "DB"
database_name = "gymfolio-d1-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/migrations"

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "0000000000000000000000000000000"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "gymfolio-media-dev"
preview_bucket_name = "gymfolio-media-dev"

[triggers]
crons = ["0 4 * * *"]

# Non-sensitive config only. Vars are non-inheritable — redeclare per environment.
[vars]
ENVIRONMENT = "development"
WEBAUTHN_RP_ID = "localhost"
WEBAUTHN_RP_NAME = "Gymfolio"
WEBAUTHN_ORIGIN = "http://localhost:5173"
# Media: "r2" (Cloudflare R2 binding MEDIA) or "b2" (Backblaze — secrets in .dev.vars).
MEDIA_BACKEND = "r2"

# Declared secret names (values come from .dev.vars locally / Worker secrets remotely).
[secrets]
required = ["MASTER_KEY"]

# ---------------------------------------------------------------------------
# Staging (free Cloudflare hostnames — no purchased domain)
# Web:  https://gymfolio-web-staging.pages.dev
# API:  https://gymfolio-api-staging.<workers-subdomain>.workers.dev
# Browser talks only to pages.dev; Pages Function proxies /api/* → Worker.
# Set WEBAUTHN_* to the *Pages* host (not workers.dev). See docs/STAGING.md.
# ---------------------------------------------------------------------------
[env.staging]
name = "gymfolio-api-staging"
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
WEBAUTHN_RP_NAME = "Gymfolio"
# Public site origin = Pages free hostname (update if your project name differs):
WEBAUTHN_RP_ID = "gymfolio-web-staging.pages.dev"
WEBAUTHN_ORIGIN = "https://gymfolio-web-staging.pages.dev"
# "r2" (default — needs [[env.staging.r2_buckets]]) or "b2" (Backblaze secrets below).
MEDIA_BACKEND = "r2"

[env.staging.secrets]
required = ["MASTER_KEY"]
# When MEDIA_BACKEND = "b2", also put (not listed as required so R2 staging still deploys):
#   wrangler secret put B2_KEY_ID --env staging
#   wrangler secret put B2_APPLICATION_KEY --env staging
#   wrangler secret put B2_BUCKET --env staging
#   wrangler secret put B2_ENDPOINT --env staging
# Optional: B2_REGION (inferred from endpoint when omitted)

# Optional later: purchased domain on Cloudflare DNS — uncomment and set zone.
# Not needed for *.pages.dev / *.workers.dev.
# [[env.staging.routes]]
# pattern = "staging.gymfolio.example.com/api/*"
# zone_name = "example.com"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "gymfolio-d1-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "../../packages/db/migrations"

[[env.staging.kv_namespaces]]
binding = "SESSIONS_KV"
id = "REPLACE_WITH_STAGING_KV_ID"

# R2 — used when MEDIA_BACKEND = "r2". Safe to leave when using B2 (unused).
[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "gymfolio-media-staging"

[env.staging.triggers]
crons = ["0 4 * * *"]
