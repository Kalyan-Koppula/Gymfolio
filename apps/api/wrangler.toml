name = "gymfolio-api-dev"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Local / default wrangler target = *dev*.
# Staging = `wrangler deploy --env staging` (see docs/STAGING.md).
# Placeholder IDs are fine for `wrangler dev` (Miniflare). Replace before --remote / deploy.
#
# Secrets (MASTER_KEY, YOUTUBE_API_KEY) must NEVER appear in this file.
# Local: apps/api/.dev.vars (gitignored). Remote: `wrangler secret put … --env <env>`.

[[d1_databases]]
binding = "DB"
database_name = "gymfolio-d1-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/migrations"

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "0000000000000000000000000000000"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "gymfolio-media-dev"
preview_bucket_name = "gymfolio-media-dev"

[triggers]
crons = ["0 4 * * *"]

# Non-sensitive config only. Vars are non-inheritable — redeclare per environment.
[vars]
ENVIRONMENT = "development"
WEBAUTHN_RP_ID = "localhost"
WEBAUTHN_RP_NAME = "Gymfolio"
WEBAUTHN_ORIGIN = "http://localhost:5173"

# Declared secret names (values come from .dev.vars locally / Worker secrets remotely).
[secrets]
required = ["MASTER_KEY"]

# ---------------------------------------------------------------------------
# Staging — pnpm --filter api deploy:staging
# 1) Create D1/KV/R2; paste IDs below.
# 2) Set WEBAUTHN_* to your real staging host.
# 3) Uncomment [[env.staging.routes]] and set zone_name / pattern.
# 4) wrangler secret put MASTER_KEY --env staging
# ---------------------------------------------------------------------------
[env.staging]
name = "gymfolio-api-staging"
# Optional: hide workers.dev URL for staging once custom route works.
# workers_dev = false

[env.staging.vars]
ENVIRONMENT = "staging"
WEBAUTHN_RP_NAME = "Gymfolio"
# Replace with your staging hostname before first remote deploy:
WEBAUTHN_RP_ID = "staging.gymfolio.example.com"
WEBAUTHN_ORIGIN = "https://staging.gymfolio.example.com"

[env.staging.secrets]
required = ["MASTER_KEY"]

# Same-origin /api/* on the Pages custom domain (zone must be on Cloudflare DNS).
# Pattern must end with /* so query strings match. Pages serves /*; this Worker owns /api/*.
# [[env.staging.routes]]
# pattern = "staging.gymfolio.example.com/api/*"
# zone_name = "example.com"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "gymfolio-d1-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "../../packages/db/migrations"

[[env.staging.kv_namespaces]]
binding = "SESSIONS_KV"
id = "REPLACE_WITH_STAGING_KV_ID"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "gymfolio-media-staging"

[env.staging.triggers]
crons = ["0 4 * * *"]
